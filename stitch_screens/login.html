<style>
        body { font-family: 'Inter', sans-serif; background-color: #fcf8ff; }

            background: rgba(255, 255, 255, 0.1);

            border: 1px solid rgba(255, 255, 255, 0.2);

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }

<body class="min-h-screen flex items-center justify-center bg-background">
<!-- Split Screen Container -->
<main class="w-full h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Abstract Glassmorphism Graphic -->
<section class="hidden md:flex md:w-1/2 relative bg-primary-container overflow-hidden items-center justify-center">
<!-- Animated Background Gradient Shell -->
<div class="absolute inset-0 z-0">

</div>
<!-- Floating Glass Elements -->
<div class="relative z-10 w-full h-full flex items-center justify-center p-xl">
<div class="relative w-full max-w-lg aspect-square">
<!-- Top Floating Card -->
<div class="absolute top-0 right-0 w-48 h-64 glass-panel rounded-3xl animate-float shadow-2xl flex flex-col p-6 items-start gap-4" style="animation-delay: -1s;">
<span class="material-symbols-outlined text-on-primary-container text-4xl">auto_awesome</span>
<div class="h-2 w-1/2 bg-white/30 rounded-full"></div>
<div class="h-2 w-full bg-white/20 rounded-full"></div>

</div>
<!-- Center Brand Focus -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-gradient-to-br from-white/40 to-white/5 border border-white/30 backdrop-blur-3xl flex items-center justify-center shadow-inner">
<div class="text-center">
<h1 class="font-display-lg text-display-lg font-bold text-white tracking-tight">StudySync</h1>
<p class="font-body-lg text-body-lg text-white/80 mt-2">Elevate your academic workflow</p>
</div>
</div>
<!-- Bottom Floating Badge -->
<div class="absolute bottom-10 left-0 w-56 h-32 glass-panel rounded-2xl animate-float shadow-2xl p-6 flex items-center gap-4" style="animation-delay: -3s;">
<div class="w-12 h-12 rounded-full bg-emerald-400/20 flex items-center justify-center">
<span class="material-symbols-outlined text-emerald-400">check_circle</span>
</div>
<div>
<div class="h-2 w-20 bg-white/30 rounded-full mb-2"></div>
<div class="h-2 w-12 bg-white/20 rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Branding Overlay -->
<div class="absolute bottom-md left-md z-20">
<p class="font-label-caps text-label-caps text-white/60 tracking-widest uppercase">Trusted by 2M+ Students</p>
</div>
</section>
<!-- Right Side: Clean Login Form -->
<section class="w-full md:w-1/2 h-full bg-surface flex items-center justify-center p-gutter relative">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="absolute top-gutter left-gutter md:hidden">
<span class="font-display-lg text-headline-lg font-bold text-primary tracking-tight">StudySync</span>
</div>
<div class="w-full max-w-[420px] space-y-lg">
<!-- Header -->
<div class="space-y-xs">
<h2 class="font-headline-lg text-headline-lg text-on-background">Sign In</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Access your dashboard and focus sessions.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative group">
<input class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all duration-200 outline-none font-body-lg text-on-background" id="email" placeholder="alex@rivers.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all duration-200 outline-none font-body-lg text-on-background" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Action Buttons -->
<div class="space-y-sm pt-base">
<button class="w-full py-4 bg-primary text-on-primary font-title-md text-title-md rounded-xl hover:shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all duration-200" type="submit">
                            Sign In
                        </button>
<div class="relative flex items-center justify-center py-base">
<span class="absolute px-4 bg-surface font-label-caps text-label-caps text-outline uppercase">Or continue with</span>
<div class="w-full h-px bg-outline-variant"></div>
</div>
<button class="w-full py-3 bg-white border border-outline-variant flex items-center justify-center gap-3 rounded-xl font-body-lg text-on-background hover:bg-surface-container-low transition-all duration-200 active:scale-[0.98]" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>

</p>

<div class="absolute bottom-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10 translate-x-1/2 translate-y-1/2"></div>
</section>
</main>
<!-- Micro-interaction Script -->
<script>
        // Subtle focus effects or input validation logic could go here
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.space-y-xs').querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.space-y-xs').querySelector('label').classList.remove('text-primary');
            });
        });

        // Simple form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Login attempt recorded.');
        });
    </script>
